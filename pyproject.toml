[project]
name = "quantum-credit-mqfs"
version = "0.1.0"
description = "An honest three-way benchmark of classical vs quantum machine learning on real credit-risk data (MQFS working paper)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nicolò Angileri", email = "nikoooo969@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "qiskit>=1.4",
    "xlrd>=2.0.1",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
# Real-QPU kernel estimation (experiments/run_hardware.py --hardware).
# Credentials are read from the user's saved QiskitRuntimeService account
# (~/.qiskit); they are NEVER stored in this repository.
hardware = ["qiskit-ibm-runtime>=0.34"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_credit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running tests excluded from CI",
    "integration: tests that require the cached UCI dataset on disk",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "experiments", "paper"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# CostMatrix is a frozen dataclass; using it as a default argument is safe.
extend-immutable-calls = ["CostMatrix", "quantum_credit.costs.CostMatrix"]
